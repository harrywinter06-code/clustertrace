name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # setup-uv@v6 still ships Node 20 internally; opt the whole workflow into
  # Node 24 (which is GitHub's default after 2026-06-02 anyway).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false  # uv.lock is gitignored

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Create venv + install
        # Use a venv (not --system) because the runner's host Python is
        # externally managed (PEP 668) on Ubuntu/macOS.
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[anthropic,openai,dev]"

      - name: Lint
        run: uv run ruff check src tests examples

      - name: Run tests
        run: uv run pytest -q
