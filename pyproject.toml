[project]
name = "clustertrace"
version = "0.9.1"
description = "Local-first LLM agent observability — decorator + OpenTelemetry ingestion, traces grouped by execution pattern, cost per call, search, replay, shareable HTML snapshots."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Winter" }]
keywords = ["llm", "agents", "tracing", "observability", "debugging", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.30"]
bedrock = ["boto3>=1.34"]
gemini = ["google-genai>=1.0"]
otel-import = ["opentelemetry-proto>=1.20"]
mcp = ["mcp>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
clustertrace = "clustertrace.cli:main"

[project.urls]
Homepage = "https://github.com/harrywinter06-code/clustertrace"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clustertrace"]

[tool.hatch.build.targets.wheel.force-include]
"src/clustertrace/data/demo-traces.jsonl" = "clustertrace/data/demo-traces.jsonl"
"src/clustertrace/py.typed" = "clustertrace/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: line length; B008: FastAPI Query() defaults are idiomatic; E701: `with x: pass` test stubs
ignore = ["E501", "B008", "E701", "E702"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
