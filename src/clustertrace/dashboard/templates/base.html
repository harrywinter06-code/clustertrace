<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}clustertrace{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>

<!-- Brand row: top of page, scrolls away on long pages. Holds the wordmark
     and the always-on header stats so a returning user sees the live state
     immediately on landing. -->
<header class="brandbar">
  <div class="brandbar-inner">
    <a class="brand" href="/">clustertrace</a>
    <div class="stats" id="header-stats">
      <span class="muted">loading…</span>
    </div>
  </div>
</header>

<!-- Nav row: thin, sticky. Primary destinations only. The brand wordmark
     above is the way to /, so "Patterns" doesn't need to live in the nav. -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/traces">Traces</a>
    <a href="/review">Review</a>
    <a href="/prompts">Prompts</a>
    <a href="/search">Search</a>
    <span class="nav-secondary-group">
      <a href="/drift" class="nav-secondary">Drift</a>
      <a href="/metrics" class="nav-secondary">Metrics</a>
      <a href="/failures" class="nav-secondary">Failure graph</a>
    </span>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<script>
  // Header stats fetch the same /api/stats every page uses for its glance.
  // Sized small in the brandbar; the landing page (/) duplicates them big.
  (async () => {
    try {
      const r = await fetch('/api/stats');
      const d = await r.json();
      const el = document.getElementById('header-stats');
      const errPct = d.traces_total ? (d.traces_error / d.traces_total * 100).toFixed(0) : '0';
      const costStr = d.total_cost_usd > 0 ? '$' + d.total_cost_usd.toFixed(2) : '$0';
      el.innerHTML = `
        <span><b>${d.traces_total}</b> runs</span>
        <span><b>${d.traces_error}</b> failed (${errPct}%)</span>
        <span class="muted"><b>${d.spans_total}</b> function calls</span>
        <span class="muted">${costStr}</span>
      `;
    } catch (e) {}
  })();
</script>
</body>
</html>
