{% extends "base.html" %}
{% block title %}Recent traces — agentlog{% endblock %}
{% block content %}
<section>
  <div class="row between">
    <h1>Recent traces</h1>
    <button id="refresh-btn" class="btn">Refresh</button>
  </div>
  <table class="traces">
    <thead>
      <tr><th>Started</th><th>Name</th><th>Status</th><th>Duration</th><th>Error</th></tr>
    </thead>
    <tbody id="traces-body"><tr><td colspan="5" class="muted">loading…</td></tr></tbody>
  </table>
</section>
<script>
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}
async function loadTraces() {
  const r = await fetch('/api/traces?limit=50');
  const data = await r.json();
  const body = document.getElementById('traces-body');
  if (!data.traces.length) {
    body.innerHTML = '<tr><td colspan="5" class="muted">No traces yet. Decorate a function with <code>@agentlog.trace</code> and run it.</td></tr>';
    return;
  }
  body.innerHTML = data.traces.map(t => `
    <tr class="${t.status === 'error' ? 'row-error' : ''}">
      <td class="muted small">${fmtTime(t.started_at)}</td>
      <td><a href="/trace/${t.id}">${escapeHtml(t.name)}</a></td>
      <td><span class="badge ${t.status}">${t.status}</span></td>
      <td>${t.duration_ms != null ? t.duration_ms + ' ms' : '—'}</td>
      <td class="muted small">${t.error_type ? escapeHtml(t.error_type) + ': ' + escapeHtml((t.error_message||'').slice(0,80)) : ''}</td>
    </tr>
  `).join('');
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('refresh-btn').addEventListener('click', loadTraces);
loadTraces();
</script>
{% endblock %}
